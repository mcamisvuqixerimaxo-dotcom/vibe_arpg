  isValidProfileName(value){

    return name.length>=1&&name.length<=16&&/^[\p{L}\p{N}]+$/u.test(name);
  },
  makeProfileId(random=Math.random,existingIds=new Set()){
    for(let attempt=0;attempt<100;attempt++){
      let id='';

    const waveCount=Math.min(target,clamp(3+Math.floor((clamp(stageId,1,30)-1)/10),3,5));

  if(!p.consumables[key])key=key===small?large:small;if(!p.consumables[key])return false;
  const def=POTION_DEFS[key],amount=combatInt(max*(def.restore+p.potionPower*(kind==='health'?1:.5)));p.consumables[key]--;p.potions=p.consumables.health_small+p.consumables.health_large;p.potionCd=kind==='health'?8.5:6.5;

}
